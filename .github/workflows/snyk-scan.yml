# This is a basic workflow to help you get started with Actions

name: Snyk scan

on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions: {}

jobs:
  # secrets are not available in a job-level `if`, so probe for the token first
  token:
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.probe.outputs.present }}
    steps:
      - id: probe
        env:
          SNYK: ${{ secrets.SNYK_TOKEN }}
        run: echo "present=$([ -n "$SNYK" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"

  # https://github.com/snyk/actions/tree/master/php
  snyk-php:
    needs:
      - token
    if: needs.token.outputs.present == 'yes'
    permissions:
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/php@master
        continue-on-error: true # To make sure that SARIF upload gets called
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --sarif-file-output=snyk.sarif
      - name: Upload result to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4.39.3
        with:
          sarif_file: snyk.sarif
