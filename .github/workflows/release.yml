name: Draft Release

on:
  push:
    tags: '[0-9]+.[0-9]+.[0-9]+'

permissions: {}

jobs:
  draft:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Fetch changelog from tag
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      - name: Extract latest changelog entry and attach it to draft
        uses: taiki-e/create-gh-release-action@v1
        with:
          changelog: CHANGELOG.md
          draft: true
          token: ${{ secrets.GITHUB_TOKEN }}

  release:
    permissions:
      contents: write
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Archives come from git itself (commit mtimes, fixed prefix) so the bytes
      # are reproducible from the tag instead of depending on GitHub's generated
      # source archives, whose hashes have changed in the past.
      - name: Build reproducible archives
        run: |
          set -eu
          V="${GITHUB_REF_NAME}"
          bin/make-release "$V" dist

      - name: Publish archives and checksums to the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/* --clobber

      - name: Generate hashes of the uploaded assets
        shell: bash
        id: hash
        run: echo "hashes=$(sha256sum dist/* | sed 's#dist/##' | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Show checksums
        run: cat dist/sha256sums.txt

  provenance:
    needs:
      - release
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.release.outputs.hashes }}"
      provenance-name: jaes-dead-drop-${{ github.ref_name }}.intoto.jsonl
      private-repository: true
      draft-release: true
      upload-assets: true
